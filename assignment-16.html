<!DOCTYPE html>
<html>
<head>
    <title>Select, Textarea and Buttons</title>
</head>
<body>

    <label for="course">Course:</label>
    <select id="course">
        <option>CSE</option>
        <option>ECE</option>
        <option>IT</option>
    </select>

    <br><br>

    <label for="feedback">Feedback:</label><br>
    <textarea id="feedback" rows="5" cols="30" placeholder="Write here..."></textarea>

    <br><br>

    <button type="submit">Submit</button>
    <button type="reset">Reset</button>
    <button type="button" onclick="alert('Hello!')">Click Me</button>

</body>
</html>
